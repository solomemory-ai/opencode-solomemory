name: Publish

on:
  push:
    branches: [v1.0]
    tags: ["v*"]

permissions:
  contents: write
  packages: write
  id-token: write

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dev:
    if: github.ref_type == 'branch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install --frozen-lockfile

      - run: bun run check

      - name: Set dev version
        run: |
          BASE_VERSION=$(jq -r .version package.json)
          SHORT_SHA=$(git rev-parse --short HEAD)
          DEV_VERSION="${BASE_VERSION}-dev.${SHORT_SHA}"
          jq --arg v "$DEV_VERSION" '.version = $v' package.json > tmp.json && mv tmp.json package.json
          echo "DEV_VERSION=$DEV_VERSION" >> "$GITHUB_ENV"

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Publish to npm
        run: npm publish --provenance --access public --tag dev

      - name: Publish to GitHub Packages
        run: |
          jq --arg name "@solomemory-ai/oc-solomemory" '.name = $name' package.json > tmp.json && mv tmp.json package.json
          echo "//npm.pkg.github.com/:_authToken=${{ secrets.GITHUB_TOKEN }}" > .npmrc
          echo "@solomemory-ai:registry=https://npm.pkg.github.com" >> .npmrc
          npm publish --tag dev

      - name: Create GitHub Pre-release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: dev-${{ github.sha }}
          name: "Dev: ${{ env.DEV_VERSION }}"
          body: "Dev build from commit ${{ github.sha }}"
          prerelease: true

  release:
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install --frozen-lockfile

      - run: bun run build

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Publish to npm
        run: npm publish --provenance --access public
        continue-on-error: true

      - name: Publish to GitHub Packages
        run: |
          jq --arg name "@solomemory-ai/oc-solomemory" '.name = $name' package.json > tmp.json && mv tmp.json package.json
          echo "//npm.pkg.github.com/:_authToken=${{ secrets.GITHUB_TOKEN }}" > .npmrc
          echo "@solomemory-ai:registry=https://npm.pkg.github.com" >> .npmrc
          npm publish

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
