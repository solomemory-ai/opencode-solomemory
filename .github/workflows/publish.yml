name: Publish

on:
  push:
    branches: [v1.0]

permissions:
  contents: write
  packages: write
  id-token: write

concurrency:
  group: publish-${{ github.sha }}
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      is-release: ${{ steps.detect.outputs.is-release }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect release tag
        id: detect
        run: |
          if git tag --points-at HEAD | grep -q '^v'; then
            echo "is-release=true" >> "$GITHUB_OUTPUT"
            echo "Release commit detected"
          else
            echo "is-release=false" >> "$GITHUB_OUTPUT"
            echo "Dev commit"
          fi

  dev:
    needs: check
    if: needs.check.outputs.is-release == 'false'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install --frozen-lockfile

      - name: Set dev version
        run: |
          BASE_VERSION=$(jq -r .version package.json)
          SHORT_SHA=$(git rev-parse --short HEAD)
          DEV_VERSION="${BASE_VERSION}-dev.${SHORT_SHA}"
          jq --arg v "$DEV_VERSION" '.version = $v' package.json > tmp.json && mv tmp.json package.json
          echo "DEV_VERSION=$DEV_VERSION" >> "$GITHUB_ENV"

      - run: bun run build

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Publish to npm
        run: npm publish --provenance --access public --tag dev

      - name: Publish to GitHub Packages
        run: |
          jq --arg name "@solomemory-ai/oc-solomemory" '.name = $name' package.json > tmp.json && mv tmp.json package.json
          echo "//npm.pkg.github.com/:_authToken=${{ secrets.GITHUB_TOKEN }}" > .npmrc
          echo "@solomemory-ai:registry=https://npm.pkg.github.com" >> .npmrc
          npm publish --tag dev

      - name: Create GitHub Pre-release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: dev-${{ github.sha }}
          name: "Dev: ${{ env.DEV_VERSION }}"
          body: "Dev build from commit ${{ github.sha }}"
          prerelease: true

  release:
    needs: check
    if: needs.check.outputs.is-release == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get release tag
        id: tag
        run: echo "name=$(git tag --points-at HEAD | grep '^v')" >> "$GITHUB_OUTPUT"

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install --frozen-lockfile

      - run: bun run build

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Publish to npm
        run: npm publish --provenance --access public
        continue-on-error: true

      - name: Publish to GitHub Packages
        run: |
          jq --arg name "@solomemory-ai/oc-solomemory" '.name = $name' package.json > tmp.json && mv tmp.json package.json
          echo "//npm.pkg.github.com/:_authToken=${{ secrets.GITHUB_TOKEN }}" > .npmrc
          echo "@solomemory-ai:registry=https://npm.pkg.github.com" >> .npmrc
          npm publish

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.name }}
          generate_release_notes: true
